services:
  - type: web
    name: intelligent-medical-diagnosis
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EXPERT_REGISTRATION_CODE
        value: CDSS-EXPERT-2026
